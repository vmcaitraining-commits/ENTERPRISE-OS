<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Left Wing Gradient: Royal Blue to Deep Indigo -->
    <linearGradient id="vmc-left-wing" x1="8" y1="6" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Right Wing Gradient: Vivid Electric Cyan to Sky Blue -->
    <linearGradient id="vmc-right-wing" x1="22" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00BAF2" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Center Fold Glow / Intersection Gradient -->
    <linearGradient id="vmc-center-ribbon" x1="14" y1="18" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow for depth -->
    <filter id="vmc-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B1F3A" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#vmc-shadow)">
    <!-- Back Loop / Bottom Fold -->
    <path 
      d="M17.5 32.5L24 43L30.5 32.5C28.5 35 25.8 36.5 24 36.5C22.2 36.5 19.5 35 17.5 32.5Z" 
      fill="#0F172A" 
      opacity="0.3"
    />

    <!-- Left Wing Ribbon -->
    <path 
      d="M7 8C8.5 6.5 12 7.5 13.5 10.5L24 35.5L20 37.5L8.5 14C7.2 11.5 6 9.2 7 8Z" 
      fill="url(#vmc-left-wing)" 
    />

    <!-- Middle Fluid Tech Ribbon connecting V -->
    <path 
      d="M13 9.5C14.5 11 19 21.5 24 34L28.5 23C26 17 21 10.5 16 8.5C14.2 7.8 12.2 8.2 13 9.5Z" 
      fill="url(#vmc-center-ribbon)" 
    />

    <!-- Right Wing Rising Tech Blade -->
    <path 
      d="M22 38L24 42C25.5 42 27 40.5 28 38.5L41.5 10C42.5 8 40.5 6.5 38.5 7.5C36 8.8 30 15 26.5 23L22 38Z" 
      fill="url(#vmc-right-wing)" 
    />

    <!-- Apex Core Light Accent -->
    <circle cx="24" cy="40.5" r="1.5" fill="#E0F2FE" />
    <path d="M38 9L41 12" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
